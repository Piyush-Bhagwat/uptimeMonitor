services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uptime-api
    ports:
      - "3030:3030"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: uptime-worker
    env_file:
      - .env
    restart: unless-stopped